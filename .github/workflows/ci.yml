name: Validate catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm check
      - name: Protect published history
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: pnpm validate --base-ref "$BASE_SHA"
      - name: Install browser for local fixture tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser transport
        env:
          CARDFACTS_BROWSER_TEST: "1"
        run: node --import tsx --test tests/browser.test.ts
      - name: Verify wiki interactions and responsive layouts
        run: pnpm test:site
