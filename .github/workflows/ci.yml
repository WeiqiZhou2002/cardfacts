name: Validate catalog
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          require-lockfile: true
      - run: pnpm check
      # Intake branches pushed with the workflow token are checked through workflow_dispatch.
      - name: Protect published history
        if: github.event_name == 'pull_request' || startsWith(github.ref_name, 'bot/')
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: pnpm validate --base-ref "$BASE_REF"
      - name: Re-verification changes only verification dates
        if: startsWith(github.head_ref, 'bot/reverify') || startsWith(github.ref_name, 'bot/reverify')
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: pnpm check-reverify-diff --base-ref "$BASE_REF"
      - name: Install browser for local fixture tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Verify browser transport
        env:
          CARDFACTS_BROWSER_TEST: "1"
        run: node --import tsx --test tests/browser.test.ts
      - name: Verify wiki interactions and responsive layouts
        run: pnpm test:site
